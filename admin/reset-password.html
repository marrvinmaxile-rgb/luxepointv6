<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luxe Point — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090911;color:#eee;font-family:Arial,sans-serif}.card{width:min(420px,calc(100% - 32px));padding:30px;background:#141421;border:1px solid #29293a;border-radius:18px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px;font-size:27px}h1 span{color:#f2cd82}p{color:#999;line-height:1.5}label{display:block;margin:18px 0 7px;color:#bbb;font-size:14px}input{width:100%;padding:13px;background:#0b0b13;color:#fff;border:1px solid #333;border-radius:10px;outline:none}input:focus{border-color:#f2cd82}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;font-weight:bold;background:linear-gradient(120deg,#d4af6a,#f2cd82,#a78bfa);cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:14px;font-size:13px;line-height:1.5}.error{color:#f87171}.success{color:#86efac}.back{display:block;text-align:center;margin-top:18px;color:#aaa;text-decoration:none;font-size:13px}.back:hover{color:#fff}.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>Luxe <span>Point</span></h1>
  <p>Atur password baru untuk akun admin kamu.</p>
  <form id="form" class="hidden">
    <label>Password Baru</label>
    <input id="password" type="password" minlength="6" placeholder="Minimal 6 karakter" required>
    <label>Konfirmasi Password</label>
    <input id="confirm" type="password" minlength="6" placeholder="Ulangi password baru" required>
    <button id="btn" type="submit">Simpan Password Baru</button>
  </form>
  <div id="msg" class="msg">Memeriksa link reset...</div>
  <a class="back" href="index.html">← Kembali ke Login Admin</a>
</div>
<script>
const sb=supabase.createClient('https://mhhkmucsbrjwjivpsdee.supabase.co','sb_publishable_aulkO9GJvMMl1YUayD1N8w_jwJuiFOK');
const form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('btn');
function show(text,type='error'){msg.textContent=text;msg.className='msg '+type}
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){form.classList.remove('hidden');msg.textContent='Silakan masukkan password baru.';msg.className='msg';return}
  show('Link reset tidak valid atau sudah kedaluwarsa. Silakan minta link reset baru dari halaman login admin.');
}
sb.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session){form.classList.remove('hidden');show('Silakan masukkan password baru.','success')}
});
form.onsubmit=async e=>{
  e.preventDefault();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  if(password.length<6)return show('Password minimal 6 karakter.');
  if(password!==confirm)return show('Konfirmasi password tidak sama.');
  btn.disabled=true;btn.textContent='Menyimpan...';show('');
  const {error}=await sb.auth.updateUser({password});
  if(error){show(error.message);btn.disabled=false;btn.textContent='Simpan Password Baru';return}
  show('Password berhasil diubah. Mengarahkan ke login admin...','success');
  setTimeout(()=>{location.href='index.html'},1200);
};
init();
</script>
</body>
</html>
