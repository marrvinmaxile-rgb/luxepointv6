<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luxe Point Admin Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090911;color:#eee;font-family:Arial}.card{width:min(390px,calc(100% - 32px));padding:30px;background:#141421;border:1px solid #29293a;border-radius:16px}h1{margin:0 0 8px}p{color:#999}label{display:block;margin:16px 0 6px;color:#aaa}input{width:100%;padding:12px;box-sizing:border-box;background:#0b0b13;color:#fff;border:1px solid #333;border-radius:9px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:9px;font-weight:bold;background:linear-gradient(120deg,#d4af6a,#f2cd82,#a78bfa);cursor:pointer}#msg{color:#f87171;margin-top:12px;font-size:13px}</style></head><body><div class="card"><h1>Luxe <span style="color:#f2cd82">Point</span></h1><p>Admin Dashboard</p><form id="f"><label>Email</label><input id="e" type="email" required><label>Password</label><input id="p" type="password" required><button id="b">Masuk</button><button id="forgot" type="button" style="margin-top:10px;background:#222;color:#ddd;border:1px solid #333">Lupa Password?</button><div id="msg"></div></form></div><script>const sb=supabase.createClient('https://mhhkmucsbrjwjivpsdee.supabase.co','sb_publishable_aulkO9GJvMMl1YUayD1N8w_jwJuiFOK');sb.auth.getSession().then(x=>{if(x.data.session)location.href='dashboard.html'});forgot.onclick=async()=>{const email=document.getElementById('e').value.trim();if(!email){msg.textContent='Masukkan email admin terlebih dahulu.';return}forgot.disabled=true;msg.textContent='Mengirim link reset...';const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname.replace(/index\.html$/,'')+'reset-password.html'});forgot.disabled=false;msg.textContent=r.error?r.error.message:'Link reset password sudah dikirim ke email tersebut.'};f.onsubmit=async event=>{event.preventDefault();b.disabled=true;b.textContent='Memeriksa...';msg.textContent='';const email=document.getElementById('e').value.trim();const password=document.getElementById('p').value;const r=await sb.auth.signInWithPassword({email,password});if(r.error){msg.textContent=r.error.message;b.disabled=false;b.textContent='Masuk';return}const a=await sb.from('admin_users').select('user_id').eq('user_id',r.data.user.id).maybeSingle();if(a.error||!a.data){await sb.auth.signOut();msg.textContent='Akun ini bukan admin.';b.disabled=false;b.textContent='Masuk';return}location.href='dashboard.html'};</script></body></html>
